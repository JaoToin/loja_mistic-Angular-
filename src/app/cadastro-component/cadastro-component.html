<div id="div-form">
    <h2> Cadastro pessoa</h2>
    <form id="form-pessoa">

        <label for="nome">NOME</label>
        <input type="text" name="nome" id="nome" class="input01" required maxlength="80" placeholder="Informe seu nome">

        <label for="cpf">CPF</label>
        <input type="text" name="cpf" d="cpf" class="input02" required maxlength="14" placeholder="Informe seu cpf">


        <label for="data_nascimento">Data Nascimento</label>
        <input type="date" name="data_nascimento"  id="data_nascimento" class="input02" placeholder="Informe sua data de nascimento">


        <label for="sexo">SEXO</label>
        <input type="radio" name="sexo"  id="sexoM" class="btnSelecao" value="M"> Masculino
        <input type="radio" name="sexo" id="sexoF" class="btnSelecao" value="F"> Feminino
        <input type="radio" name="sexo" id="sexoN" class="btnSelecao" value="N"> Não se Identificar


        <label for="telefone">telefone</label>
        <input type="text" name="telefone"  id="telefone" class="input02" required maxlength="9"
            placeholder="Informe seu telefone">


        <label for="email">Email</label>
        <input type="text" name="email"  id="email" class="input02" placeholder="Informe seu email">



        <label for="senha">Senha</label>
        <input type="password" name="senha"  id="senha" class="input02" placeholder="Informe sua senha">


        <div id="div-btns">

            <button type="button" id="BtnAdd">
              CADASTRAR
            </button>
        </div>
