<div id="div-lista">
  <h1>Lista Pessoas</h1>

  <div id="lista-Pessoa">
    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>Idade</th>
          <th>CPF</th>
          <th>Sexo</th>
          <th>Telefone</th>
          <th>Email</th>
          <th></th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (elem of pessoas(); track elem.idpessoa) {
          <tr class="item-Pessoa">
            <td>{{ elem.nome }}</td>
            <td>{{ calcIdade(elem.data_nascimento) }}</td>
            <td>{{ elem.cpf }}</td>
            <td>{{ elem.sexo }}</td>
            <td>{{ elem.telefone }}</td>
            <td>{{ elem.email }}</td>
            <td class="lnk-editar">
              <a (click)="buscarPessoaPorId(elem.idpessoa)"> Editar </a>
            </td>
            <td class="lnk-excluir"><a (click)="excluirPessoa(elem)"> Excluir </a></td>
          </tr>
        } @empty {
          <tr>
            <!-- O colspan="8" garante que a mensagem ocupe todas as colunas da tabela -->
            <td colspan="8" class="div-item-pessoa" style="text-align: center">
              NENHUM REGISTRO NA LISTA
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
