<div id="div-form">
    <h1> Cadastro pessoa</h1>
    <form id="form-pessoa" (ngSubmit)="enviaDadosPessoa()">

        <label for="nome">NOME</label>
        <input type="text" name="nome" [(ngModel)]="nome" id="nome" class="input01" required maxlength="80" placeholder="Informe seu nome">

        <label for="cpf">CPF</label>
        <input type="text" name="cpf" [(ngModel)]="cpf" id="cpf" class="input02" required maxlength="14" placeholder="Informe seu cpf">


        <label for="data_nascimento" >Data Nascimento</label>
        <input type="date" name="data_nascimento"  [(ngModel)]="data_nascimento" id="data_nascimento" class="input02" placeholder="Informe sua data de nascimento">

      <div id="div-sexo">
        <label for="sexo">SEXO</label>
        <input type="radio" name="sexo"  [(ngModel)]="sexo" id="sexoM" class="btnSelecao" value="M"> Masculino
        <input type="radio" name="sexo" [(ngModel)]="sexo" id="sexoF" class="btnSelecao" value="F"> Feminino
        <input type="radio" name="sexo" [(ngModel)]="sexo" id="sexoN" class="btnSelecao" value="N"> Não Declarar
      </div>

        <label for="telefone">telefone</label>
        <input type="text" name="telefone"  [(ngModel)]="telefone" id="telefone" class="input02" required maxlength="15"
            placeholder="Informe seu telefone">


        <label for="email">Email</label>
        <input type="text" name="email"  [(ngModel)]="email" id="email" class="input02" placeholder="Informe seu email">



        <label for="senha">Senha</label>
        <input type="password" name="senha"  [(ngModel)]="senha" id="senha" class="input02" placeholder="Informe sua senha">


        <div id="div-bnts">

         <button type="submit" id="bntAdd" >Cadastrar</button>

         <button type="button" id="bntListar" (click)="direcao()">Listar Pessoas</button>

         <button type="reset" id="bntLimpar" (click)="limpar()">Limpar Dados</button>

        </div>
    </form>

</div>
